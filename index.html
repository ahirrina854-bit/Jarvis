<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--bg2:#04252B;--ink:#CFE3E5;--dim:#6E9AA0;--cy:#3FD0D4;--cy2:#1E8E96;--line:rgba(63,208,212,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden;background:radial-gradient(90% 55% at 50% 38%,var(--bg2),var(--bg) 75%) fixed}
body::after{content:"";position:fixed;inset:0;z-index:9;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.65))}
header,.stage,.cap,.chips,form,.tools{transition:opacity .9s ease,transform .9s ease}
header{transition-delay:0s}.stage{transition-delay:.25s}.cap{transition-delay:.55s}.chips{transition-delay:.75s}form{transition-delay:.95s}.tools{transition-delay:1.15s}
body.boot header,body.boot .stage,body.boot .cap,body.boot .chips,body.boot form,body.boot .tools{opacity:0;transform:translateY(10px)}
header{position:relative;height:92px;border-top:2px solid var(--cy);border-bottom:2px solid var(--cy);box-shadow:0 0 12px -2px var(--cy),inset 0 0 18px -8px var(--cy);background:rgba(0,16,20,.7);overflow:hidden;flex:none}
#mx{position:absolute;inset:0;font:9px/10px monospace;color:var(--cy);opacity:.28;word-break:break-all;overflow:hidden;pointer-events:none}
.ttl{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:400 clamp(18px,6vw,26px) Michroma,sans-serif;letter-spacing:.28em;color:#C9D6D8;text-shadow:0 0 10px rgba(63,208,212,.5)}
#hud{position:absolute;right:-8px;top:-4px;width:100px;height:100px}
#hud circle{fill:none;stroke:var(--cy);transform-box:fill-box;transform-origin:center}
.h1{stroke-width:7;stroke-dasharray:34 9 6 9;animation:spin 30s linear infinite}
.h2{stroke-width:2;stroke-dasharray:3 4;animation:spin 14s linear infinite reverse}
.h3{stroke-width:4;stroke-dasharray:50 12;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{display:grid;place-items:center;flex:none;padding:6px 0 0}
#orb{width:min(90vw,38vh,360px);height:min(90vw,38vh,360px);filter:drop-shadow(0 0 18px rgba(63,208,212,.35))}
.cap{flex:1 1 0;min-height:60px;overflow-y:auto;margin:6px 14px 0;padding:10px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(0,18,22,.55)}
#status{font:500 12px "Chakra Petch",sans-serif;color:var(--cy);letter-spacing:.08em;text-align:center;margin-bottom:4px}
#you{color:var(--dim);font-size:14px;min-height:21px;overflow-wrap:anywhere;text-align:center}
#say{font:500 19px/1.38 "Chakra Petch",sans-serif;overflow-wrap:anywhere;white-space:pre-wrap;text-align:center;margin-top:2px}
#act{text-align:center}
#act a{display:inline-block;margin-top:10px;padding:8px 16px;border:1px solid var(--cy);border-radius:2px;color:var(--cy);text-decoration:none;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip,.tg{flex:none;background:rgba(0,24,30,.7);border:1px solid var(--line);color:var(--ink);border-radius:2px;padding:7px 13px;font:500 14px "Chakra Petch",sans-serif;cursor:pointer}
form{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 14px 0;flex:none}
#inp{width:100%;background:rgba(0,24,30,.7);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:11px 14px;font:inherit;text-align:center}
#inp::placeholder{color:var(--dim)}
#mic{width:84px;height:84px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;filter:drop-shadow(0 0 12px rgba(46,170,230,.7))}
#mic svg{width:100%;height:100%;display:block}
body[data-s=listen] #mic{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 26px #9FEFFF);transform:scale(1.07)}}
.tools{display:flex;justify-content:space-around;flex:none;margin-top:6px;border-top:2px solid var(--cy);background:rgba(0,16,20,.7);box-shadow:0 0 12px -2px var(--cy)}
.tl{background:none;border:0;color:var(--dim);font:500 13px "Chakra Petch",sans-serif;padding:11px 10px;cursor:pointer}
.chip:focus-visible,.tl:focus-visible,.tg:focus-visible,#mic:focus-visible,#inp:focus-visible,#go:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto}
.sheet[hidden]{display:none}
.sheet h2{font:700 18px "Chakra Petch",sans-serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;color:var(--cy)}
#hl,#opts{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#opts label{display:flex;flex-direction:column;gap:4px;font:500 14px "Chakra Petch",sans-serif;color:var(--dim)}
#opts input[type=range]{accent-color:var(--cy);width:100%}
.m{max-width:88%;padding:9px 13px;border-radius:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--cy2);color:#fff}
.m.j{align-self:flex-start;background:rgba(0,30,36,.8);border:1px solid var(--line)}
#boot{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .9s ease}
#boot.off{opacity:0;pointer-events:none}
#go{background:none;border:2px solid var(--cy);color:var(--cy);font:700 16px Michroma,sans-serif;letter-spacing:.2em;padding:16px 26px;border-radius:2px;cursor:pointer;box-shadow:0 0 22px -4px var(--cy)}
#bl{font:13px/1.7 monospace;color:var(--cy);min-height:120px;width:min(300px,80vw)}
#br{width:90px;height:90px;border:2px dashed var(--cy);border-radius:50%;animation:spin 6s linear infinite;box-shadow:0 0 24px -6px var(--cy)}
@media (prefers-reduced-motion:reduce){#hud *,#mic,#br{animation:none!important}}
</style>
</head>
<body class="boot" data-s="idle">
<header>
  <div id="mx" aria-hidden="true"></div>
  <div class="ttl">J.A.R.V.I.S.</div>
  <svg id="hud" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="h1" cx="50" cy="50" r="42"/><circle class="h2" cx="50" cy="50" r="33"/><circle class="h3" cx="50" cy="50" r="25"/>
    <circle cx="50" cy="50" r="9" style="stroke-width:3"/><circle cx="50" cy="50" r="2.5" style="fill:var(--cy)"/>
  </svg>
</header>
<div class="stage"><canvas id="orb" aria-hidden="true"></canvas></div>
<section class="cap" aria-live="polite">
  <div id="status">Ready</div><div id="you"></div><div id="say"></div><div id="act"></div>
</section>
<nav class="chips" id="chips"></nav>
<form id="f" autocomplete="off">
  <input id="inp" type="text" placeholder="Likho ya neeche reactor dabao" aria-label="Message">
  <button id="mic" type="button" aria-label="Bolo">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F6F7"/><stop offset=".45" stop-color="#7C878C"/><stop offset="1" stop-color="#D5DCDE"/></linearGradient><radialGradient id="mg"><stop offset="0" stop-color="#1A7DB5"/><stop offset="1" stop-color="#06202E"/></radialGradient></defs>
    <circle cx="50" cy="50" r="48" fill="url(#mt)"/><circle cx="50" cy="50" r="41" fill="#0B2230" stroke="#2B8FC0" stroke-width="2"/><circle cx="50" cy="50" r="35" fill="url(#mg)"/>
    <polygon points="50,22 77,67 23,67" fill="none" stroke="#C6F4FF" stroke-width="5" stroke-linejoin="round"/><polygon points="50,41 60,58 40,58" fill="#E8FCFF"/></svg>
  </button>
</form>
<div class="tools">
  <button class="tl" id="lang" type="button">Bhasha: हिंदी</button>
  <button class="tl" id="setb" type="button">Settings</button>
  <button class="tl" id="histb" type="button">History</button>
</div>
<div class="sheet" id="hist" hidden><h2>History <button class="tl" id="hx" type="button">Band karo</button></h2><div id="hl"></div></div>
<div class="sheet" id="set" hidden>
  <h2>Settings <button class="tl" id="sx" type="button">Band karo</button></h2>
  <div id="opts">
    <label>Awaaz ki gehrai (kam = bhari awaaz)<input id="pitch" type="range" min="0.5" max="1.3" step="0.05" value="0.8"></label>
    <label>Bolne ki raftar<input id="rate" type="range" min="0.7" max="1.2" step="0.02" value="0.92"></label>
    <button class="tg" id="test" type="button">Awaaz test karo</button>
    <label>Anthropic API key (sirf is phone mein save hoti hai)<input id="key" type="password" autocomplete="off" placeholder="sk-ant-..." style="width:100%;background:rgba(0,24,30,.7);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:11px 14px;font:inherit"></label>
  </div>
</div>
<div id="boot"><div id="br"></div><div id="bl"></div><button id="go" type="button">START</button></div>
<script type="module" src="./main.js"></script>
</body>
</html>
